<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Multiplayer Heartbeat v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#050505;
  font-family: ui-monospace, 'SF Mono', Menlo, monospace; color:#999; }
canvas { display:block; position:fixed; inset:0; }

#mixer { position:fixed; bottom:0; left:0; right:0; background:rgba(5,5,8,0.92);
  border-top:1px solid #1a1a22; padding:10px 16px; display:flex; gap:12px;
  align-items:center; z-index:20; backdrop-filter:blur(8px); }
.channel { flex:1; max-width:200px; background:#0e0e12; border:1px solid #1a1a22;
  border-radius:6px; padding:10px 12px; cursor:pointer; transition:border-color 0.2s; }
.channel:hover { border-color:#333; }
.channel.muted { opacity:0.3; }
.channel.solo { border-color:#e6b26c; }
.ch-name { font-size:12px; color:#ccc; cursor:text; }
.ch-name:focus { outline:none; color:#fff; }
.ch-hr { font-size:20px; color:#fff; font-variant-numeric:tabular-nums; margin:4px 0; }
.ch-instrument { font-size:10px; color:#555; text-transform:uppercase; letter-spacing:0.1em; }
.ch-btns { display:flex; gap:4px; margin-top:6px; }
.ch-btn { font:9px monospace; padding:2px 6px; border-radius:2px; cursor:pointer; border:1px solid #333; background:none; color:#666; }
.ch-btn:hover { border-color:#666; color:#ccc; }
.ch-btn.active { background:#333; color:#fff; }
.ch-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }

#sync-bar { position:fixed; top:12px; left:50%; transform:translateX(-50%);
  width:200px; height:4px; border-radius:2px; background:rgba(255,255,255,0.05); z-index:10; }
#sync-fill { height:100%; width:0; border-radius:2px; background:rgba(255,255,255,0.4); transition:width 0.3s; }
#sync-label { position:fixed; top:20px; left:50%; transform:translateX(-50%);
  font-size:10px; color:rgba(255,255,255,0.2); z-index:10; }

#preset-bar { position:fixed; top:12px; right:16px; display:flex; gap:6px; z-index:10; }
.preset-btn { font:10px monospace; padding:3px 8px; border-radius:3px; cursor:pointer;
  border:1px solid #222; background:none; color:#555; }
.preset-btn:hover { border-color:#555; color:#ccc; }
.preset-btn.active { border-color:#e6b26c; color:#e6b26c; }
</style>
</head><body>

<canvas id="c"></canvas>
<div id="sync-bar"><div id="sync-fill"></div></div>
<div id="sync-label">sync —</div>

<div id="preset-bar">
  <button class="preset-btn active" data-preset="ambient">ambient</button>
  <button class="preset-btn" data-preset="rhythmic">rhythmic</button>
  <button class="preset-btn" data-preset="melodic">melodic</button>
  <button class="preset-btn" data-preset="full">full</button>
</div>

<div id="mixer"></div>

<div id="config" style="display:none;position:fixed;top:40px;left:16px;background:rgba(5,5,8,0.92);
  border:1px solid #1a1a22;border-radius:6px;padding:14px 18px;z-index:30;font-size:11px;width:260px;
  backdrop-filter:blur(8px)">
  <div style="color:#555;margin-bottom:8px">CONFIG (Shift+.)</div>
  <label>attraction <input type="range" id="cfg-attract" min="0" max="100" value="40" style="width:120px;vertical-align:middle"> <span id="cfg-attract-v">0.4</span></label><br>
  <label>gravity <input type="range" id="cfg-gravity" min="0" max="100" value="30" style="width:120px;vertical-align:middle"> <span id="cfg-gravity-v">0.3</span></label><br>
  <label>particle life <input type="range" id="cfg-life" min="10" max="200" value="100" style="width:120px;vertical-align:middle"> <span id="cfg-life-v">1.0</span></label><br>
  <label>volume <input type="range" id="cfg-vol" min="0" max="100" value="30" style="width:120px;vertical-align:middle"> <span id="cfg-vol-v">0.3</span></label><br>
  <label>particle count <input type="range" id="cfg-count" min="1" max="30" value="8" style="width:120px;vertical-align:middle"> <span id="cfg-count-v">8</span></label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const dpr = Math.min(devicePixelRatio, 2);
  let W, H;

  function resize() {
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize(); addEventListener('resize', resize);

  // ── Matter.js physics ──
  const Engine = Matter.Engine, World = Matter.World, Bodies = Matter.Bodies, Body = Matter.Body, Events = Matter.Events;
  const engine = Engine.create({ gravity: { x: 0, y: 0.3 } });
  const world = engine.world;

  // collision sounds
  let lastCollisionSound = 0;
  const COLLISION_GAP = 0.025;

  function playCollisionSound(speed, isWall) {
    if (!audioCtx || !masterGain) return;
    const now = audioCtx.currentTime;
    if (now - lastCollisionSound < COLLISION_GAP) return;
    lastCollisionSound = now;

    const impact = Math.min(1, speed / 8);
    if (impact < 0.1) return;

    // gravity affects pitch: heavier gravity = lower sounds
    const gravPitch = 1 + (1 - cfg.gravity) * 0.5; // low gravity = higher pitch
    // attraction affects sustain: more attraction = longer, more reverb-like
    const attractSustain = 1 + cfg.attract * 3;

    if (isWall) {
      // floor/wall: thud — pitch from gravity
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime((40 + impact * 30) * gravPitch, now);
      osc.frequency.exponentialRampToValueAtTime(20 * gravPitch, now + 0.12);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1 * attractSustain);
      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.15 * attractSustain);

      // high gravity = add sub-bass rumble
      if (cfg.gravity > 0.5) {
        const sub = audioCtx.createOscillator();
        sub.type = 'sine';
        sub.frequency.value = 25;
        const sg = audioCtx.createGain();
        sg.gain.setValueAtTime(impact * 0.03 * cfg.gravity, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        sub.connect(sg); sg.connect(masterGain);
        sub.start(now); sub.stop(now + 0.15);
      }
    } else {
      // particle-particle: tuned note — attraction affects harmony
      const semitone = SCALE[Math.floor(Math.random() * SCALE.length)];
      const freq = ROOT * Math.pow(2, (semitone + 12) / 12) * gravPitch;
      const osc = audioCtx.createOscillator();
      osc.type = cfg.attract > 0.6 ? 'sine' : 'triangle'; // more attraction = purer tone
      osc.frequency.value = freq;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.025, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1 * attractSustain);
      osc.connect(g); g.connect(masterGain);
      osc.start(now); osc.stop(now + 0.15 * attractSustain);

      // high attraction: add consonant harmony (fifth above)
      if (cfg.attract > 0.3 && Math.random() < cfg.attract) {
        const h = audioCtx.createOscillator();
        h.type = 'sine';
        h.frequency.value = freq * 1.5;
        const hg = audioCtx.createGain();
        hg.gain.setValueAtTime(impact * 0.01 * cfg.attract, now + 0.01);
        hg.gain.exponentialRampToValueAtTime(0.001, now + 0.2 * attractSustain);
        h.connect(hg); hg.connect(masterGain);
        h.start(now + 0.01); h.stop(now + 0.25 * attractSustain);
      }
    }
  }

  // walls
  const wallOpts = { isStatic: true, render: { visible: false }, restitution: 0.6, label: 'wall' };
  const walls = [
    Bodies.rectangle(W/2, H + 25, W + 100, 50, wallOpts),
    Bodies.rectangle(W/2, -25, W + 100, 50, wallOpts),
    Bodies.rectangle(-25, H/2, 50, H + 100, wallOpts),
    Bodies.rectangle(W + 25, H/2, 50, H + 100, wallOpts),
  ];
  World.add(world, walls);

  // collision events → sound
  Events.on(engine, 'collisionStart', (event) => {
    for (const pair of event.pairs) {
      const speed = Math.sqrt(
        Math.pow((pair.bodyA.velocity?.x || 0) - (pair.bodyB.velocity?.x || 0), 2) +
        Math.pow((pair.bodyA.velocity?.y || 0) - (pair.bodyB.velocity?.y || 0), 2)
      );
      const isWall = pair.bodyA.label === 'wall' || pair.bodyB.label === 'wall';
      playCollisionSound(speed, isWall);
    }
  });

  // particles linked to physics bodies
  const matterParticles = []; // { body, owner, type, born, maxLife, color, size }
  const MAX_PARTICLES = 400;

  // ── ECG waveform traces (Excalidraw style) ──
  // Each participant has a scrolling chalk-line ECG trace
  const waveforms = {}; // pid -> { points: [{x,y,body}], side: 'left'|'right', hrHistory: [] }
  let visualMode = 'particles'; // 'particles' | 'waves' | 'both'
  const WAVE_MAX_POINTS = 300;

  function initWaveform(pid, side) {
    if (waveforms[pid]) return;
    waveforms[pid] = {
      points: [],
      side, // 'left' = enters from left, 'right' = enters from right
      hrHistory: [],
      lastSample: 0,
      offset: 0,
    };
  }

  function sampleWaveform(pid, hr, rmssd) {
    const wf = waveforms[pid];
    if (!wf) return;
    const now = performance.now() / 1000;
    if (now - wf.lastSample < 0.033) return;
    wf.lastSample = now;

    const baseY = H / 2;
    const dir = wf.side === 'left' ? 1 : -1;

    // smooth scroll
    wf.offset += 1.8 * dir;
    const startX = wf.side === 'left' ? 0 : W;
    const x = startX + wf.offset;

    // ECG shape: mostly flat baseline with QRS complexes
    const beatInterval = hr > 0 ? 30 * 60 / hr : 30; // samples between beats
    wf._sampleCount = (wf._sampleCount || 0) + 1;
    const phase = wf._sampleCount % Math.round(beatInterval);

    let y = baseY;
    let isSpike = false;

    // QRS complex shape over ~8 samples
    if (phase === 0) { y = baseY + 5; } // P wave
    else if (phase === 2) { y = baseY - 8; } // Q
    else if (phase === 3) { y = baseY - (90 + Math.random() * 40); isSpike = true; } // R peak
    else if (phase === 4) { y = baseY + 25; } // S
    else if (phase === 5) { y = baseY + 8; } // S recovery
    else if (phase === 8) { y = baseY - 12; } // T wave
    else if (phase === 9) { y = baseY - 8; }
    else {
      // baseline with subtle noise
      const hrvChaos = Math.max(2, Math.min(15, (rmssd || 20) * 0.3));
      y = baseY + (Math.random() - 0.5) * hrvChaos;
    }

    // slow breathing undulation
    y += Math.sin(now * 0.6) * 12;
    // chalk wobble
    y += (Math.random() - 0.5) * 2;

    // physics body only for R-peaks (they collide with the other trace)
    let body = null;
    if (isSpike) {
      body = Bodies.circle(x, y, 4, {
        restitution: 0.8, friction: 0.05, frictionAir: 0.01, density: 0.002,
      });
      Body.setVelocity(body, { x: dir * 2, y: -1 });
      World.add(world, body);
    }

    wf.points.push({ x, y, body, isSpike, born: now, color: participants[pid]?.color || '#fff' });

    // trim old
    while (wf.points.length > WAVE_MAX_POINTS) {
      const old = wf.points.shift();
      if (old.body) World.remove(world, old.body);
    }

    // reset scroll when reaching opposite side
    if ((wf.side === 'left' && wf.offset > W * 0.7) ||
        (wf.side === 'right' && wf.offset < -W * 0.7)) {
      wf.offset = 0;
      wf._sampleCount = 0;
    }
  }

  function drawWaveforms() {
    for (const [pid, wf] of Object.entries(waveforms)) {
      if (wf.points.length < 3) continue;
      const color = participants[pid]?.color || '#ffffff';
      const cr = parseInt(color.slice(1,3),16);
      const cg = parseInt(color.slice(3,5),16);
      const cb = parseInt(color.slice(5,7),16);

      // main trace — smooth quadratic curves
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.75)`;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();

      for (let i = 0; i < wf.points.length; i++) {
        const pt = wf.points[i];
        // use physics body position if it exists (R-peaks move), otherwise fixed position
        const px = pt.body ? pt.body.position.x : pt.x;
        const py = pt.body ? pt.body.position.y : pt.y;

        if (i === 0) {
          ctx.moveTo(px, py);
        } else if (i < wf.points.length - 1) {
          // quadratic curve through midpoints for smoothness
          const next = wf.points[i + 1];
          const nx = next.body ? next.body.position.x : next.x;
          const ny = next.body ? next.body.position.y : next.y;
          const mx = (px + nx) / 2;
          const my = (py + ny) / 2;
          ctx.quadraticCurveTo(px, py, mx, my);
        } else {
          ctx.lineTo(px, py);
        }
      }
      ctx.stroke();

      // chalk glow pass
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.2)`;
      ctx.lineWidth = 5;
      ctx.stroke();

      // R-peak glow dots
      for (const pt of wf.points) {
        if (pt.isSpike && pt.body) {
          const pos = pt.body.position;
          const age = performance.now() / 1000 - pt.born;
          const glow = Math.max(0, 1 - age * 2);
          if (glow > 0) {
            ctx.fillStyle = `rgba(${cr},${cg},${cb},${glow * 0.8})`;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 4 + glow * 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }
    }
  }

  function spawnBeat(pid, x, y, color, count, instrumentType) {
    for (let i = 0; i < count && matterParticles.length < MAX_PARTICLES; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 6;
      const size = instrumentType === 'bass' ? 6 + Math.random() * 8 :
                   instrumentType === 'perc' ? 2 + Math.random() * 3 :
                   3 + Math.random() * 5;
      const life = instrumentType === 'bass' ? 8 + Math.random() * 6 :
                   instrumentType === 'perc' ? 2 + Math.random() * 3 :
                   4 + Math.random() * 5;

      // preset affects physics
      const presetPhysics = {
        ambient: { restitution: 0.3, frictionAir: 0.015, speedMul: 0.5 },
        rhythmic: { restitution: 0.9, frictionAir: 0.002, speedMul: 1.5 },
        melodic: { restitution: 0.6, frictionAir: 0.008, speedMul: 0.8 },
        full: { restitution: 0.7, frictionAir: 0.005, speedMul: 1.0 },
      }[currentPreset] || { restitution: 0.7, frictionAir: 0.005, speedMul: 1.0 };

      const body = Bodies.circle(x + (Math.random()-0.5)*20, y + (Math.random()-0.5)*20, size, {
        restitution: presetPhysics.restitution, friction: 0.01, frictionAir: presetPhysics.frictionAir,
        density: instrumentType === 'bass' ? 0.005 : 0.001,
      });
      Body.setVelocity(body, {
        x: Math.cos(angle) * speed * presetPhysics.speedMul,
        y: Math.sin(angle) * speed * presetPhysics.speedMul - 3
      });
      World.add(world, body);

      matterParticles.push({
        body, owner: pid, type: instrumentType,
        born: performance.now() / 1000, maxLife: life,
        color, size,
      });
    }
  }

  // ── Audio ──
  let audioCtx = null;
  let masterGain = null;
  let currentPreset = 'ambient';

  const INSTRUMENTS = {
    bass:  { wave: 'sine',     octave: -1, attack: 0.01, decay: 0.4, vol: 0.08 },
    pad:   { wave: 'sine',     octave: 0,  attack: 0.1,  decay: 1.5, vol: 0.04 },
    lead:  { wave: 'triangle', octave: 1,  attack: 0.005,decay: 0.3, vol: 0.05 },
    perc:  { wave: 'sawtooth', octave: 2,  attack: 0.002,decay: 0.08,vol: 0.03 },
    bell:  { wave: 'sine',     octave: 2,  attack: 0.001,decay: 0.6, vol: 0.03 },
    string:{ wave: 'sawtooth', octave: 0,  attack: 0.05, decay: 0.8, vol: 0.04 },
  };
  const INSTRUMENT_NAMES = Object.keys(INSTRUMENTS);

  const SCALE = [0, 2, 4, 5, 7, 9, 11]; // major scale semitones
  const ROOT = 130.81; // C3

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.3;
    // reverb
    const convolver = audioCtx.createConvolver();
    const len = audioCtx.sampleRate * 2;
    const ir = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(len*0.12));
    }
    convolver.buffer = ir;
    const reverbGain = audioCtx.createGain();
    reverbGain.gain.value = 0.15;
    masterGain.connect(audioCtx.destination);
    masterGain.connect(convolver);
    convolver.connect(reverbGain);
    reverbGain.connect(audioCtx.destination);
  }

  function playInstrumentNote(instrument, noteIdx, sync, velocity) {
    if (!audioCtx) return;
    const inst = INSTRUMENTS[instrument];
    if (!inst) return;
    const t = audioCtx.currentTime;

    const PRESET_CONFIG = {
      ambient: { volMul: 0.6, decayMul: 3, filterFreq: 600, filterQ: 0.5, reverbMul: 1, subdivisions: 1, detune: 5 },
      rhythmic: { volMul: 1.2, decayMul: 0.5, filterFreq: 5000, filterQ: 6, reverbMul: 0.3, subdivisions: 2, detune: 0 },
      melodic: { volMul: 1.0, decayMul: 1.5, filterFreq: 3000, filterQ: 1, reverbMul: 0.8, subdivisions: 1, detune: 2 },
      full: { volMul: 1.0, decayMul: 1.0, filterFreq: 4000, filterQ: 2, reverbMul: 0.5, subdivisions: 3, detune: 3 },
    };
    const pc = PRESET_CONFIG[currentPreset] || PRESET_CONFIG.ambient;

    // subdivisions: rhythmic/full play extra notes after the beat
    const notesToPlay = pc.subdivisions;
    for (let sub = 0; sub < notesToPlay; sub++) {
      const subDelay = sub * 0.12;
      const subIdx = noteIdx + sub;
      const semitone = SCALE[subIdx % SCALE.length] + 12 * inst.octave;
      const freq = ROOT * Math.pow(2, semitone / 12);

      const osc = audioCtx.createOscillator();
      osc.type = currentPreset === 'ambient' ? 'sine' :
                 currentPreset === 'rhythmic' ? (instrument === 'perc' ? 'square' : inst.wave) :
                 inst.wave;
      osc.frequency.value = freq;
      // detune for richness
      if (pc.detune > 0) osc.detune.value = (Math.random() - 0.5) * pc.detune;

      const decay = inst.decay * pc.decayMul;
      const gain = audioCtx.createGain();
      const vol = inst.vol * velocity * pc.volMul * (sub === 0 ? 1 : 0.4);
      gain.gain.setValueAtTime(0, t + subDelay);
      gain.gain.linearRampToValueAtTime(vol, t + subDelay + inst.attack);
      gain.gain.exponentialRampToValueAtTime(0.001, t + subDelay + inst.attack + decay);

      const filt = audioCtx.createBiquadFilter();
      filt.type = 'lowpass';
      filt.frequency.value = pc.filterFreq + sync * 2000;
      filt.Q.value = pc.filterQ;

      osc.connect(filt); filt.connect(gain); gain.connect(masterGain);
      osc.start(t + subDelay); osc.stop(t + subDelay + inst.attack + decay + 0.1);

      // harmony note for melodic/full
      if ((currentPreset === 'melodic' || currentPreset === 'full') && sub === 0 && sync > 0.3) {
        const h = audioCtx.createOscillator();
        h.type = 'sine';
        h.frequency.value = freq * 1.5; // fifth
        const hg = audioCtx.createGain();
        hg.gain.setValueAtTime(vol * 0.25, t + 0.03);
        hg.gain.exponentialRampToValueAtTime(0.001, t + decay * 0.8);
        h.connect(hg); hg.connect(masterGain);
        h.start(t + 0.03); h.stop(t + decay);
      }
    }

    // percussion noise on every preset (louder in rhythmic)
    if (instrument === 'perc' || currentPreset === 'rhythmic') {
      const dur = currentPreset === 'rhythmic' ? 0.05 : 0.02;
      const bufLen = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufLen; i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(bufLen*0.04));
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = currentPreset === 'rhythmic' ? 4000 : 7000;
      const ng = audioCtx.createGain();
      const nv = currentPreset === 'rhythmic' ? 0.06 : 0.02;
      ng.gain.setValueAtTime(nv * velocity, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      src.connect(hp); hp.connect(ng); ng.connect(masterGain);
      src.start(t); src.stop(t + dur + 0.01);
    }

    // sub-bass thump for bass instrument
    if (instrument === 'bass') {
      const sub = audioCtx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(55, t);
      sub.frequency.exponentialRampToValueAtTime(30, t + 0.15);
      const sg = audioCtx.createGain();
      sg.gain.setValueAtTime(0.06 * velocity * pc.volMul, t);
      sg.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      sub.connect(sg); sg.connect(masterGain);
      sub.start(t); sub.stop(t + 0.25);
    }
  }

  // ── Participants ──
  const participants = {};
  let syncValue = 0;

  function ensureParticipant(pid, data) {
    if (!participants[pid]) {
      const idx = Object.keys(participants).length;
      const side = idx % 2 === 0 ? 'left' : 'right';
      initWaveform(pid, side);
      participants[pid] = {
        ...data,
        instrument: INSTRUMENT_NAMES[idx % INSTRUMENT_NAMES.length],
        muted: false,
        solo: false,
        noteIndex: 0,
        spawnX: W * (0.25 + idx * 0.5 / Math.max(1, Object.keys(participants).length)),
        clickCount: 0,
        lastClick: 0,
      };
      rebuildMixer();
    }
    Object.assign(participants[pid], data);
  }

  // ── Mixer UI ──
  function rebuildMixer() {
    const mixer = document.getElementById('mixer');
    mixer.innerHTML = '';
    const hasSolo = Object.values(participants).some(p => p.solo);

    for (const [pid, p] of Object.entries(participants)) {
      const ch = document.createElement('div');
      ch.className = 'channel' + (p.muted ? ' muted' : '') + (p.solo ? ' solo' : '');
      ch.innerHTML = `
        <div style="display:flex;align-items:center;gap:6px">
          <span class="ch-dot" style="background:${p.color}"></span>
          <span class="ch-name" contenteditable="true" data-pid="${pid}">${p.name}</span>
        </div>
        <div class="ch-hr" id="hr-${pid}">${p.bpm || '—'}</div>
        <div class="ch-instrument" data-pid="${pid}">${p.instrument}</div>
        <div class="ch-btns">
          <button class="ch-btn ${p.muted ? 'active' : ''}" data-action="mute" data-pid="${pid}">M</button>
          <button class="ch-btn ${p.solo ? 'active' : ''}" data-action="solo" data-pid="${pid}">S</button>
          <button class="ch-btn" data-action="instrument" data-pid="${pid}">▸</button>
        </div>
      `;

      // click on channel body to change instrument
      ch.addEventListener('dblclick', (e) => {
        if (e.target.contentEditable === 'true') return;
        const idx = INSTRUMENT_NAMES.indexOf(p.instrument);
        p.instrument = INSTRUMENT_NAMES[(idx + 1) % INSTRUMENT_NAMES.length];
        rebuildMixer();
      });

      mixer.appendChild(ch);
    }

    // button handlers
    mixer.querySelectorAll('.ch-btn').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const pid = btn.dataset.pid;
        const p = participants[pid];
        if (btn.dataset.action === 'mute') {
          p.muted = !p.muted;
        } else if (btn.dataset.action === 'solo') {
          p.solo = !p.solo;
        } else if (btn.dataset.action === 'instrument') {
          const idx = INSTRUMENT_NAMES.indexOf(p.instrument);
          p.instrument = INSTRUMENT_NAMES[(idx + 1) % INSTRUMENT_NAMES.length];
        }
        rebuildMixer();
      };
    });

    // rename handlers
    mixer.querySelectorAll('.ch-name').forEach(el => {
      el.onblur = () => {
        const pid = el.dataset.pid;
        if (participants[pid]) participants[pid].name = el.textContent.trim() || 'anon';
      };
      el.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } };
    });
  }

  function isAudible(pid) {
    const p = participants[pid];
    if (!p) return false;
    if (p.muted) return false;
    const hasSolo = Object.values(participants).some(pp => pp.solo);
    if (hasSolo && !p.solo) return false;
    return true;
  }

  // ── Preset buttons ──
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPreset = btn.dataset.preset;
    };
  });

  // ── WebSocket ──
  let ws = null;
  function connect() {
    ws = new WebSocket('ws://localhost:9000');
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'view' }));
      initAudio();
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type !== 'state') return;

      syncValue = msg.sync || 0;
      document.getElementById('sync-fill').style.width = (syncValue * 100) + '%';
      document.getElementById('sync-label').textContent = `sync ${(syncValue * 100).toFixed(0)}%`;

      for (const [pid, data] of Object.entries(msg.participants || {})) {
        const prevBeat = participants[pid] ? participants[pid].lastBeat : null;
        ensureParticipant(pid, data);
        const p = participants[pid];

        // update HR display
        const hrEl = document.getElementById('hr-' + pid);
        if (hrEl) hrEl.textContent = p.bpm;

        // continuously feed waveform
        if (visualMode === 'waves' || visualMode === 'both') {
          sampleWaveform(pid, p.bpm, p.rmssd);
        }

        // detect new beat
        if (data.lastBeat && data.lastBeat !== prevBeat) {
          // HRV affects particle count + size: high RMSSD = more, bigger, calmer particles
          const hrvCalm = Math.max(0, Math.min(1, (p.rmssd - 5) / 50));
          const baseCount = p.instrument === 'bass' ? 5 : p.instrument === 'perc' ? 12 : 8;
          const count = Math.round(baseCount * (0.5 + hrvCalm));

          spawnBeat(pid, p.spawnX, H * 0.4, p.color, count, p.instrument);

          // HRV affects note selection: high RMSSD = higher notes (brighter), low = lower (darker)
          if (isAudible(pid)) {
            // HRV drives melodic direction
            if (hrvCalm > 0.5) {
              p.noteIndex = Math.min(SCALE.length * 2 - 1, p.noteIndex + 1); // ascending when calm
            } else {
              p.noteIndex = Math.max(0, p.noteIndex - 1); // descending when stressed
            }
            // velocity from HRV: calm = softer, stressed = harder
            const vel = 0.5 + (1 - hrvCalm) * 0.6 + syncValue * 0.2;
            playInstrumentNote(p.instrument, p.noteIndex, syncValue, vel);
          }
        }
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  connect();

  // ── Click interactions ──
  canvas.addEventListener('click', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  // ── Config panel ──
  const cfg = { attract: 0.4, gravity: 0.3, lifeMul: 1.0, vol: 0.3, countMul: 1.0 };
  let configVisible = false;

  function setupConfig() {
    const binds = [
      ['cfg-attract', 'attract', 100],
      ['cfg-gravity', 'gravity', 100],
      ['cfg-life', 'lifeMul', 100],
      ['cfg-vol', 'vol', 100],
      ['cfg-count', 'countMul', 10],
    ];
    for (const [id, key, div] of binds) {
      const el = document.getElementById(id);
      const vEl = document.getElementById(id + '-v');
      el.oninput = () => {
        cfg[key] = el.value / div;
        vEl.textContent = cfg[key].toFixed(1);
        if (key === 'gravity') engine.gravity.y = cfg.gravity;
        if (key === 'vol' && masterGain) masterGain.gain.value = cfg.vol;
      };
    }
  }
  setupConfig();

  // ── Render ──
  function render() {
    requestAnimationFrame(render);
    Engine.update(engine, 1000 / 60);

    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);

    const now = performance.now() / 1000;

    // update walls on resize
    Body.setPosition(walls[0], { x: W/2, y: H + 25 });
    Body.setPosition(walls[1], { x: W/2, y: -25 });
    Body.setPosition(walls[3], { x: W + 25, y: H/2 });

    // ── Inter-participant attraction ──
    if (cfg.attract > 0) {
      const owners = [...new Set(matterParticles.map(p => p.owner))];
      if (owners.length >= 2) {
        for (const p of matterParticles) {
          for (const q of matterParticles) {
            if (p.owner === q.owner) continue;
            if (Math.random() > 0.05) continue; // sample 5% of pairs for perf
            const dx = q.body.position.x - p.body.position.x;
            const dy = q.body.position.y - p.body.position.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 10 || dist > 300) continue;
            const force = cfg.attract * 0.00002 / (dist * 0.01);
            Body.applyForce(p.body, p.body.position, {
              x: dx / dist * force,
              y: dy / dist * force,
            });
          }
        }
      }
    }

    // draw + cull particles
    for (let i = matterParticles.length - 1; i >= 0; i--) {
      const p = matterParticles[i];
      const age = now - p.born;
      if (age > p.maxLife || p.body.position.y > H + 50) {
        World.remove(world, p.body);
        matterParticles.splice(i, 1);
        continue;
      }

      const lifeFrac = 1 - age / p.maxLife;
      const eased = 1 - Math.pow(1 - lifeFrac, 3);
      const alpha = eased * 0.85; // high contrast for projector
      const size = p.size * (0.4 + eased * 0.6);
      const pos = p.body.position;

      // parse hex color
      const hex = p.color || '#ffffff';
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);

      // glow for bass
      if (p.type === 'bass' && size > 4) {
        const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, size * 3);
        grad.addColorStop(0, `rgba(${r},${g},${b},${alpha * 0.2})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, size * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.fill();
    }

    // draw attraction threads between nearby particles of different owners
    if (cfg.attract > 0.1) {
      ctx.lineWidth = 0.5;
      for (let i = 0; i < matterParticles.length; i += 3) { // sample for perf
        const p = matterParticles[i];
        const pPos = p.body.position;
        for (let j = i + 1; j < matterParticles.length; j += 3) {
          const q = matterParticles[j];
          if (p.owner === q.owner) continue;
          const qPos = q.body.position;
          const dx = qPos.x - pPos.x, dy = qPos.y - pPos.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist > 100) continue;
          const alpha = (1 - dist / 100) * 0.12 * cfg.attract;
          ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(pPos.x, pPos.y);
          ctx.lineTo(qPos.x, qPos.y);
          ctx.stroke();
        }
      }
    }

    // draw waveforms
    if (visualMode === 'waves' || visualMode === 'both') {
      drawWaveforms();
    }

    // draw participant spawn zones (particles mode)
    if (visualMode === 'particles' || visualMode === 'both') {
      for (const [pid, p] of Object.entries(participants)) {
        ctx.fillStyle = p.color + '10';
        ctx.beginPath();
        ctx.arc(p.spawnX, H * 0.4, 60, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // name labels — large for projector
    for (const [pid, p] of Object.entries(participants)) {
      ctx.fillStyle = p.color + '60';
      ctx.font = '14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, p.spawnX, H - 80);
      ctx.font = '24px monospace';
      ctx.fillStyle = p.color + '90';
      ctx.fillText(p.bpm || '—', p.spawnX, H - 55);
    }

    // mode label
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`V=${visualMode}`, 12, 16);
  }
  render();

  // keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen().catch(()=>{});
    if (e.key === 'v' || e.key === 'V') {
      const modes = ['particles', 'waves', 'both'];
      visualMode = modes[(modes.indexOf(visualMode) + 1) % modes.length];
    }
    if (e.key === '>' || (e.shiftKey && e.key === '.')) {
      configVisible = !configVisible;
      document.getElementById('config').style.display = configVisible ? 'block' : 'none';
    }
  });
})();
</script>
</body></html>
