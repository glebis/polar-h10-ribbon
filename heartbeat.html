<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>♥</title>
<style>
* { margin:0; padding:0; }
html, body { width:100%; height:100%; overflow:hidden; background:#050505; cursor:none; }
canvas { display:block; width:100%; height:100%; }
#info {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  font:13px/1.4 'SF Mono',Menlo,monospace; color:rgba(255,255,255,0.15);
  text-align:center; pointer-events:none; user-select:none;
}
#bpm-display {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font:120px/1 'SF Mono',Menlo,monospace; color:rgba(255,40,40,0.08);
  pointer-events:none; user-select:none; font-variant-numeric:tabular-nums;
  transition: color 0.1s;
}
#status {
  position:fixed; top:12px; left:50%; transform:translateX(-50%);
  font:11px 'SF Mono',Menlo,monospace; color:rgba(255,255,255,0.12);
  pointer-events:none; opacity:0; transition:opacity 0.5s;
}
#status.visible { opacity:1; }
#controls {
  position:fixed; top:12px; right:16px; font:10px 'SF Mono',Menlo,monospace;
  color:rgba(255,255,255,0.2); pointer-events:none;
}
</style></head><body>
<canvas id="c"></canvas>
<div id="bpm-display">--</div>
<div id="info"></div>
<div id="status">connecting...</div>
<div id="controls">A=audio S=style >=data F=fullscreen</div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', {alpha:false});
  const bpmEl = document.getElementById('bpm-display');
  const infoEl = document.getElementById('info');
  const statusEl = document.getElementById('status');

  let W, H;
  const dpr = Math.min(devicePixelRatio, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  // State
  let currentHR = 0;
  let currentRMSSD = 0;
  let lastBeatTime = 0;
  let beatPhase = 1;
  let expectedInterval = 1;
  let rrHistory = [];
  const RR_MAX = 30;
  let breath01 = 0.5; // 0=exhale, 1=inhale from bridge

  // Visual style
  let style = 0;
  const STYLES = ['pulse', 'ring', 'particles'];

  // ── Harmonic engine ──
  // HRV determines the chord quality. Each heartbeat steps the progression.
  // Particle collisions play notes from the current chord.
  const CHORDS = {
    // calm → warm major/add9 voicings
    bliss:    [1, 5/4, 3/2, 2, 5/2],       // major add9
    calm:     [1, 5/4, 3/2, 15/8],          // major 7
    easy:     [1, 5/4, 3/2, 9/4],           // major 9
    // mid → suspended, open
    neutral:  [1, 4/3, 3/2, 2],             // sus4
    drift:    [1, 9/8, 3/2, 2],             // sus2
    // stress → minor, diminished
    tense:    [1, 6/5, 3/2, 9/5],           // minor 7
    dark:     [1, 6/5, 36/25, 9/5],         // half-dim
    edge:     [1, 6/5, 36/25, 16/9],        // diminished
  };
  const CALM_PROGRESSION = ['bliss', 'calm', 'easy', 'calm'];
  const MID_PROGRESSION  = ['neutral', 'drift', 'neutral', 'calm'];
  const STRESS_PROGRESSION = ['tense', 'dark', 'tense', 'edge'];

  let chordIdx = 0;
  let currentChordName = 'neutral';
  let currentRoot = 130.81; // C3

  // roots move through a calm cycle: C → G → Am → F (I → V → vi → IV)
  const ROOT_CYCLE_CALM   = [130.81, 196.00, 220.00, 174.61];
  const ROOT_CYCLE_STRESS = [130.81, 123.47, 116.54, 110.00]; // descending minor

  function advanceHarmony() {
    const hrvCalm = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 35)) : 0.5;
    let prog, roots;
    if (hrvCalm > 0.65) { prog = CALM_PROGRESSION; roots = ROOT_CYCLE_CALM; }
    else if (hrvCalm > 0.3) { prog = MID_PROGRESSION; roots = ROOT_CYCLE_CALM; }
    else { prog = STRESS_PROGRESSION; roots = ROOT_CYCLE_STRESS; }

    chordIdx = (chordIdx + 1) % prog.length;
    currentChordName = prog[chordIdx];
    currentRoot = roots[chordIdx % roots.length];
  }

  function getChordFreqs() {
    const ratios = CHORDS[currentChordName] || CHORDS.neutral;
    return ratios.map(r => currentRoot * r);
  }

  // state descriptor for UI
  function getHrvState() {
    if (currentRMSSD <= 0) return { label: '—', level: 0.5 };
    const calm = Math.max(0, Math.min(1, (currentRMSSD - 5) / 35));
    if (calm > 0.7) return { label: 'calm', level: calm };
    if (calm > 0.5) return { label: 'settling', level: calm };
    if (calm > 0.3) return { label: 'active', level: calm };
    if (calm > 0.15) return { label: 'tense', level: calm };
    return { label: 'stressed', level: calm };
  }

  // Particle system
  const particles = [];
  const MAX_PARTICLES = 1200;

  // Particle types: bass (large, slow, deep), mid (medium, melodic), glass (tiny, fast, crystalline)
  const PTYPES = {
    bass:  { sizeMin: 6, sizeMax: 14, speedMin: 20,  speedMax: 80,  lifeMin: 4, lifeMax: 8,  gravMul: 1.5, dragMin: 0.985, dragMax: 0.995 },
    mid:   { sizeMin: 2, sizeMax: 6,  speedMin: 60,  speedMax: 200, lifeMin: 2, lifeMax: 5,  gravMul: 1.0, dragMin: 0.97,  dragMax: 0.99 },
    glass: { sizeMin: 1, sizeMax: 3,  speedMin: 150, speedMax: 400, lifeMin: 0.8, lifeMax: 2, gravMul: 0.3, dragMin: 0.95,  dragMax: 0.97 },
  };

  function spawnBeat(now) {
    const cx = W/2, cy = H/2;
    const hrStress = currentHR > 0 ? Math.max(0, Math.min(1, (currentHR - 60) / 80)) : 0;
    // high HRV = more bass, low HRV = more glass shards
    const hrvCalm = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 40)) : 0.5;

    const bassCount  = Math.floor(5 + hrvCalm * 12);
    const midCount   = Math.floor(15 + currentHR / 8);
    const glassCount = Math.floor(5 + (1 - hrvCalm) * 20 + hrStress * 15);

    function spawn(ptype, count) {
      const p = PTYPES[ptype];
      for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = p.speedMin + Math.random() * (p.speedMax - p.speedMin) + hrStress * 50;
        const ringBonus = style === 1 ? 6 : 0; // particles live longer inside the ring
        const life = p.lifeMin + Math.random() * (p.lifeMax - p.lifeMin) + hrvCalm * 2 + ringBonus;
        const size = p.sizeMin + Math.random() * (p.sizeMax - p.sizeMin);
        particles.push({
          x: cx + (Math.random() - 0.5) * 20,
          y: cy + (Math.random() - 0.5) * 20,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (ptype === 'glass' ? 80 : 20),
          size, maxSize: size, life, maxLife: life, born: now,
          type: ptype,
          hue: ptype === 'bass' ? 0.0 : ptype === 'mid' ? Math.random() * 0.06 : 0.12 + Math.random() * 0.08,
          drag: p.dragMin + Math.random() * (p.dragMax - p.dragMin),
          gravity: (15 + Math.random() * 25) * p.gravMul,
          wobble: (Math.random() - 0.5) * (ptype === 'glass' ? 6 : 2),
        });
      }
    }

    spawn('bass', bassCount);
    spawn('mid', midCount);
    spawn('glass', glassCount);
  }

  // ── collision sounds ──
  // per-channel throttle so bass doesn't block glass
  const lastSoundBy = { bass: 0, mid: 0, glass: 0, pair: 0 };
  const SOUND_GAP = { bass: 0.06, mid: 0.04, glass: 0.03, pair: 0.025 };

  // pentatonic scale for pair collisions — size determines pitch
  const PENTA = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4, 5/2, 3, 10/3]; // 2 octaves

  function playCollisionSound(speed, ptype, pitch) {
    if (!audioCtx || audioMode === 0) return;
    const t = audioCtx.currentTime;
    const ch = ptype;
    if (t - (lastSoundBy[ch] || 0) < SOUND_GAP[ch]) return;
    lastSoundBy[ch] = t;

    const impact = Math.min(1, speed / 250);
    if (impact < 0.08) return;

    if (ptype === 'bass') {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(35 + impact * 25, t);
      osc.frequency.exponentialRampToValueAtTime(20, t + 0.2);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.25);
    } else if (ptype === 'glass') {
      const dur = 0.015 + Math.random() * 0.02;
      const len = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(len*0.04));
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const freq = pitch || (4000 + Math.random() * 8000);
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.value = freq; filt.Q.value = 25 + Math.random() * 50;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.07, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06 + Math.random() * 0.12);
      src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
      src.start(t); src.stop(t + dur + 0.01);
    } else if (ptype === 'mid') {
      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = pitch || (180 + Math.random() * 300);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      const filt = audioCtx.createBiquadFilter();
      filt.type = 'lowpass'; filt.frequency.value = 900; filt.Q.value = 2;
      osc.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.12);
    } else if (ptype === 'pair') {
      // inter-particle collision: tuned note from pentatonic scale
      const noteHz = pitch || 220;
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = noteHz;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(impact * 0.035, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3 + impact * 0.4);
      // gentle reverb
      const del = audioCtx.createDelay(); del.delayTime.value = 0.08;
      const dg = audioCtx.createGain(); dg.gain.value = 0.08;
      osc.connect(g); g.connect(audioCtx.destination);
      g.connect(del); del.connect(dg); dg.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.8);
    }
  }

  // containment radius for ring mode — set during render
  let containRadius = 0;
  let containCx = 0, containCy = 0;

  // ring health — degrades with hits, pops when depleted
  let ringHealth = 1.0;       // 1.0 = solid, 0.0 = popped
  let ringMaxHealth = 1.0;
  let ringPopped = false;
  let ringPopTime = 0;
  let ringPopRadius = 0;
  let ringHits = 0;
  const RING_HIT_DAMAGE = 0.008;  // each collision chips the ring
  const RING_REGEN = 0.0004;      // slow regeneration
  const RING_POP_EXPAND = 1.8;    // how much the ring expands on pop
  const RING_POP_DURATION = 3.0;  // seconds for pop animation

  function hitRing(speed) {
    if (ringPopped) return;
    const damage = RING_HIT_DAMAGE * Math.min(2, speed / 100);
    ringHealth = Math.max(0, ringHealth - damage);
    ringHits++;
    if (ringHealth <= 0) {
      ringPopped = true;
      ringPopTime = performance.now() / 1000;
      ringPopRadius = containRadius;
    }
  }

  // mass from particle type
  function pmass(p) { return p.type === 'bass' ? 4 : p.type === 'mid' ? 1 : 0.3; }

  function updateParticles(dt, now) {
    const inRing = style === 1 && containRadius > 0;
    const G = 300; // gravity px/s²
    const n = particles.length;

    // remove dead
    for (let i = n - 1; i >= 0; i--) {
      if (now - particles[i].born > particles[i].maxLife) {
        particles.splice(i, 1);
      }
    }

    // inter-particle collisions (check nearby pairs, not O(n²) full)
    // spatial hash with cell size ~30px
    const cellSize = 30;
    const grid = {};
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const cx = Math.floor(p.x / cellSize);
      const cy = Math.floor(p.y / cellSize);
      const key = cx + ',' + cy;
      (grid[key] || (grid[key] = [])).push(i);
    }

    for (const key in grid) {
      const cell = grid[key];
      const [cx, cy] = key.split(',').map(Number);
      // check this cell + neighbors
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const nkey = (cx+dx) + ',' + (cy+dy);
          const ncell = grid[nkey];
          if (!ncell) continue;
          for (const i of cell) {
            for (const j of ncell) {
              if (j <= i) continue;
              const a = particles[i], b = particles[j];
              const ddx = b.x - a.x, ddy = b.y - a.y;
              const dist = Math.sqrt(ddx*ddx + ddy*ddy);
              const minDist = a.maxSize + b.maxSize;
              if (dist < minDist && dist > 0.1) {
                // elastic collision
                const nx = ddx/dist, ny = ddy/dist;
                const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
                const dvn = dvx*nx + dvy*ny;
                if (dvn > 0) { // approaching
                  const ma = pmass(a), mb = pmass(b);
                  const impulse = 2 * dvn / (ma + mb);
                  a.vx -= impulse * mb * nx;
                  a.vy -= impulse * mb * ny;
                  b.vx += impulse * ma * nx;
                  b.vy += impulse * ma * ny;
                  // separate
                  const overlap = minDist - dist;
                  a.x -= nx * overlap * 0.5;
                  a.y -= ny * overlap * 0.5;
                  b.x += nx * overlap * 0.5;
                  b.y += ny * overlap * 0.5;

                  // collision note: pick from current chord, octave from size
                  const cFreqs = getChordFreqs();
                  const combinedSize = a.maxSize + b.maxSize;
                  const sizeNorm = Math.max(0, Math.min(1, 1 - (combinedSize - 2) / 20));
                  const idx = Math.floor(sizeNorm * (cFreqs.length - 0.01));
                  const octave = sizeNorm > 0.7 ? 2 : sizeNorm > 0.4 ? 1 : 0.5;
                  const noteHz = cFreqs[idx] * octave;
                  const relSpeed = Math.abs(dvn);
                  playCollisionSound(relSpeed, 'pair', noteHz);
                }
              }
            }
          }
        }
      }
    }

    // integrate
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];

      // real gravity — always downward, scaled by mass
      if (inRing) {
        // reduced gravity in ring, still pulls down
        p.vy += G * 0.25 * dt;
      } else {
        p.vy += G * dt;
      }

      // air drag (velocity-dependent, not constant multiplier)
      const speed = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
      if (speed > 0) {
        const dragForce = speed * speed * 0.0003 / pmass(p);
        const dragFactor = Math.max(0, 1 - dragForce * dt);
        p.vx *= dragFactor;
        p.vy *= dragFactor;
      }

      // wobble (brownian)
      p.vx += (Math.random() - 0.5) * p.wobble * 20 * dt;

      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (inRing) {
        const dx = p.x - containCx, dy = p.y - containCy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const boundary = ringPopped ? containRadius * RING_POP_EXPAND : containRadius;
        if (!ringPopped && dist > containRadius - p.maxSize) {
          const nx = dx/dist, ny = dy/dist;
          p.x = containCx + nx * (containRadius - p.maxSize - 1);
          p.y = containCy + ny * (containRadius - p.maxSize - 1);
          const dot = p.vx*nx + p.vy*ny;
          const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
          p.vx -= 1.8 * dot * nx;
          p.vy -= 1.8 * dot * ny;
          p.vx *= 0.75;
          p.vy *= 0.75;
          playCollisionSound(spd, p.type);
          hitRing(spd);
        } else if (ringPopped && dist > boundary - p.maxSize) {
          // popped ring is a soft, expanded boundary
          const nx = dx/dist, ny = dy/dist;
          p.x = containCx + nx * (boundary - p.maxSize - 1);
          p.y = containCy + ny * (boundary - p.maxSize - 1);
          const dot = p.vx*nx + p.vy*ny;
          p.vx -= 1.4 * dot * nx;
          p.vy -= 1.4 * dot * ny;
          p.vx *= 0.85;
          p.vy *= 0.85;
        }
      } else {
        // floor
        if (p.y > H - 10) {
          const spd = Math.abs(p.vy);
          p.y = H - 10;
          p.vy *= -0.4; // bouncier
          p.vx *= 0.85;
          if (spd > 15) playCollisionSound(spd, p.type);
        }
        // walls
        if (p.x < 0) {
          const spd = Math.abs(p.vx);
          p.x = 0; p.vx *= -0.5;
          if (spd > 20) playCollisionSound(spd, p.type);
        }
        if (p.x > W) {
          const spd = Math.abs(p.vx);
          p.x = W; p.vx *= -0.5;
          if (spd > 20) playCollisionSound(spd, p.type);
        }
      }

      p.life = p.maxLife - (now - p.born);
    }
  }

  function drawParticles(hrStress) {
    for (const p of particles) {
      const lifeFrac = p.life / p.maxLife;
      const easedLife = 1 - Math.pow(1 - lifeFrac, 3);
      const size = p.maxSize * (0.3 + easedLife * 0.7);
      let r, g, b, alpha;

      if (p.type === 'bass') {
        // deep red-maroon, large glow, slow fade
        alpha = easedLife * (0.4 + hrStress * 0.3);
        r = 180 + (1 - lifeFrac) * 40;
        g = 15 + p.hue * 100;
        b = 10;
      } else if (p.type === 'glass') {
        // bright white-blue-cyan, sharp, sparkly
        alpha = easedLife * easedLife * (0.5 + hrStress * 0.4);
        r = 180 + (1 - lifeFrac) * 75;
        g = 200 + (1 - lifeFrac) * 55;
        b = 220 + (1 - lifeFrac) * 35;
      } else {
        // mid: warm orange-amber ember
        alpha = easedLife * (0.35 + hrStress * 0.4);
        r = 210 + (1 - lifeFrac) * 45;
        g = 50 + (1 - lifeFrac) * 60 + p.hue * 400;
        b = 15 + (1 - lifeFrac) * 20;
      }

      // Glow halo — bass gets big halos, glass gets small sharp ones
      const glowMul = p.type === 'bass' ? 4 : p.type === 'glass' ? 1.5 : 2.5;
      if (size > 1.5 && alpha > 0.08) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, size * glowMul);
        grad.addColorStop(0, `rgba(${r|0},${g|0},${b|0},${alpha * 0.25})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * glowMul, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},${alpha})`;
      ctx.fill();
    }
  }

  // Audio
  let audioCtx = null;
  let audioEnabled = false;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // Audio mode
  let audioMode = 0;
  const AUDIO_MODES = ['off', 'bass', 'bass+glass', 'bass+glass+chords', 'generative'];

  // ── Generative sequencer engine ──────────────────────────────────
  // Runs independently, heartbeats push energy into it,
  // HRV parameters shape everything: scale, density, timbre, rhythm.

  const GEN = {
    running: false,
    nextStepTime: 0,
    stepIndex: 0,

    // Euclidean pattern — density from coherence
    euclidean(pulses, steps) {
      const p = new Array(steps).fill(false);
      if (pulses <= 0) return p;
      for (let i = 0; i < steps; i++) {
        if (Math.floor((pulses / steps) * (i + 1)) > Math.floor((pulses / steps) * i)) p[i] = true;
      }
      return p;
    },

    // Scales: RMSSD selects the mode
    scales: {
      lydian:     [0, 2, 4, 6, 7, 9, 11],  // dreamy, bright (high HRV)
      major:      [0, 2, 4, 5, 7, 9, 11],  // stable, happy
      mixolydian: [0, 2, 4, 5, 7, 9, 10],  // bluesy, relaxed
      dorian:     [0, 2, 3, 5, 7, 9, 10],  // jazzy, neutral
      minor:      [0, 2, 3, 5, 7, 8, 10],  // melancholic
      phrygian:   [0, 1, 3, 5, 7, 8, 10],  // dark, tense (low HRV)
      locrian:    [0, 1, 3, 5, 6, 8, 10],  // most dissonant
    },
    scaleNames: ['lydian', 'major', 'mixolydian', 'dorian', 'minor', 'phrygian', 'locrian'],

    getScale() {
      const calm = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 35)) : 0.5;
      const idx = Math.floor((1 - calm) * (this.scaleNames.length - 0.01));
      return this.scales[this.scaleNames[idx]];
    },

    getRoot() {
      // root follows chord progression from harmonic engine
      return currentRoot || 130.81;
    },

    // melodic contour: rising when HRV trending up, falling when down
    melody: { pos: 3, direction: 1, lastNote: 0 },

    nextNote(scale) {
      const trend = rrHistory.length > 6 ? (rrHistory[rrHistory.length-1] - rrHistory[rrHistory.length-6]) : 0;
      // tendency: positive trend = ascending, negative = descending
      const upProb = 0.5 + Math.max(-0.3, Math.min(0.3, trend * 0.001));

      if (Math.random() < upProb) {
        this.melody.pos = Math.min(scale.length * 2 - 1, this.melody.pos + 1);
      } else {
        this.melody.pos = Math.max(0, this.melody.pos - 1);
      }
      // occasional leap
      if (Math.random() < 0.1) this.melody.pos = Math.floor(Math.random() * scale.length * 2);

      const octave = Math.floor(this.melody.pos / scale.length);
      const degree = this.melody.pos % scale.length;
      const semitone = scale[degree] + octave * 12;
      return this.getRoot() * Math.pow(2, semitone / 12);
    },

    // voices: bass drone, pad, lead melody, percussion
    voices: {},

    start(ctx) {
      if (this.running) return;
      this.running = true;
      this.nextStepTime = ctx.currentTime + 0.1;

      // create shared effects
      this.reverb = ctx.createConvolver();
      const len = ctx.sampleRate * 2;
      const ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.15));
      }
      this.reverb.buffer = ir;
      this.reverbGain = ctx.createGain();
      this.reverbGain.gain.value = 0.12;
      this.reverb.connect(this.reverbGain);
      this.reverbGain.connect(ctx.destination);

      // compressor for glue
      this.comp = ctx.createDynamicsCompressor();
      this.comp.threshold.value = -18;
      this.comp.ratio.value = 4;
      this.comp.connect(ctx.destination);
      this.comp.connect(this.reverb);

      this.schedule(ctx);
    },

    schedule(ctx) {
      if (!this.running) return;

      const calm = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 35)) : 0.5;
      const beatInterval = currentHR > 0 ? 60 / currentHR : 0.8;
      const stepTime = beatInterval / 4;

      let coherenceVal = 0.5;
      if (rrHistory.length >= 4) {
        const mn = rrHistory.reduce((a,b)=>a+b,0)/rrHistory.length;
        const vr = rrHistory.reduce((a,b)=>a+(b-mn)**2,0)/rrHistory.length;
        coherenceVal = Math.max(0, Math.min(1, 1 - Math.sqrt(vr)/mn * 5));
      }

      const steps = 16;
      const elapsed = ctx.currentTime - (this._startTime || (this._startTime = ctx.currentTime));

      // ── PHRASE STRUCTURE: 4-bar phrases, voice arrangement changes each phrase ──
      const barIndex = Math.floor(this.stepIndex / steps);
      const phraseIndex = Math.floor(barIndex / 4);
      const barInPhrase = barIndex % 4;

      // voice activity pattern per phrase — keeps it evolving
      const arrangements = [
        { melody: true, bass: true, perc: false, pad: true },   // intro: melody + pad
        { melody: true, bass: true, perc: true, pad: false },   // rhythm enters
        { melody: false, bass: true, perc: true, pad: true },   // melody drops, space
        { melody: true, bass: true, perc: true, pad: true },    // full
        { melody: true, bass: false, perc: false, pad: true },  // breakdown
        { melody: false, bass: true, perc: true, pad: false },  // bass + rhythm only
      ];
      const arr = arrangements[phraseIndex % arrangements.length];

      // ── PATTERN ROTATION: Euclidean patterns shift each bar ──
      const melodyPulses = Math.round(3 + coherenceVal * 6);
      const bassPulses = Math.round(2 + calm * 3);
      const percPulses = Math.round(4 + (1-calm) * 6);
      const rotate = (pat, n) => { const a = [...pat]; for(let i=0;i<n;i++) a.push(a.shift()); return a; };
      const melodyPattern = rotate(this.euclidean(melodyPulses, steps), barInPhrase * 3);
      const bassPattern = rotate(this.euclidean(bassPulses, steps), barInPhrase * 2);
      const percPattern = rotate(this.euclidean(percPulses, steps), barInPhrase);

      const scale = this.getScale();
      const root = this.getRoot();

      // ── REGISTER SHIFT: melody octave wanders over time ──
      const octaveShift = Math.floor(Math.sin(elapsed * 0.02) * 1.5);

      // ── SWING: humanize timing ──
      const swing = 0.02 + calm * 0.04;

      while (this.nextStepTime < ctx.currentTime + 0.15) {
        const step = this.stepIndex % steps;
        const stepSwing = step % 2 === 1 ? swing * stepTime : 0;
        const t = this.nextStepTime + stepSwing;
        const mv = breath01 || 0;

        // ── MELODY ──
        if (arr.melody && melodyPattern[step]) {
          const freq = this.nextNote(scale) * Math.pow(2, octaveShift);
          // note length variety: short staccato vs long legato
          const isLong = Math.random() < calm * 0.4;
          const sustain = isLong ? stepTime * 3 : stepTime * (0.4 + Math.random() * 0.4);
          const waveTypes = ['sine', 'triangle', 'sawtooth'];
          const waveIdx = Math.min(2, Math.floor((1 - calm) * 2.5 + Math.random() * 0.5));

          const osc = ctx.createOscillator();
          osc.type = waveTypes[waveIdx];
          osc.frequency.value = freq;

          // pitch slide on some notes
          if (Math.random() < 0.15) {
            const slideTarget = this.nextNote(scale) * Math.pow(2, octaveShift);
            osc.frequency.setValueAtTime(freq, t);
            osc.frequency.exponentialRampToValueAtTime(slideTarget, t + sustain * 0.5);
          }

          const env = ctx.createGain();
          const vol = 0.035 + calm * 0.025;
          const attack = isLong ? 0.05 : 0.005;
          env.gain.setValueAtTime(0, t);
          env.gain.linearRampToValueAtTime(vol, t + attack);
          env.gain.setValueAtTime(vol * (isLong ? 0.6 : 0.8), t + sustain * 0.3);
          env.gain.exponentialRampToValueAtTime(0.001, t + sustain);

          const filt = ctx.createBiquadFilter();
          filt.type = 'lowpass';
          // filter opens and closes with breath
          filt.frequency.value = 600 + calm * 3500 + mv * 2000 + Math.sin(elapsed * 0.5) * 500;
          filt.Q.value = 1 + (1-calm) * 4;

          osc.connect(filt); filt.connect(env); env.connect(this.comp);
          osc.start(t); osc.stop(t + sustain + 0.05);

          // occasional harmony note (third or fifth above)
          if (Math.random() < coherenceVal * 0.3) {
            const harmRatio = Math.random() < 0.5 ? 5/4 : 3/2;
            const h = ctx.createOscillator();
            h.type = 'sine';
            h.frequency.value = freq * harmRatio;
            const hg = ctx.createGain();
            hg.gain.setValueAtTime(vol * 0.3, t + 0.02);
            hg.gain.exponentialRampToValueAtTime(0.001, t + sustain * 0.8);
            h.connect(hg); hg.connect(this.reverb);
            h.start(t + 0.02); h.stop(t + sustain);
          }
        }

        // ── BASS ──
        if (arr.bass && bassPattern[step]) {
          const degreePool = [0, 4, 3, 2]; // root, fifth, fourth, third
          const deg = degreePool[step % degreePool.length];
          const bassFreq = root * 0.5 * Math.pow(2, (scale[deg % scale.length] || 0) / 12);
          const osc = ctx.createOscillator();
          osc.type = barInPhrase % 2 === 0 ? 'sine' : 'triangle';
          osc.frequency.value = bassFreq;
          const dur = stepTime * (1.5 + calm);
          const env = ctx.createGain();
          env.gain.setValueAtTime(0.055, t);
          env.gain.exponentialRampToValueAtTime(0.001, t + dur);
          // sub octave
          const sub = ctx.createOscillator();
          sub.type = 'sine';
          sub.frequency.value = bassFreq * 0.5;
          const subG = ctx.createGain();
          subG.gain.setValueAtTime(0.035, t);
          subG.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(env); env.connect(this.comp);
          sub.connect(subG); subG.connect(this.comp);
          osc.start(t); osc.stop(t + dur + 0.05);
          sub.start(t); sub.stop(t + dur + 0.05);
        }

        // ── PERCUSSION ──
        if (arr.perc && percPattern[step]) {
          const isKick = step % 4 === 0;
          const isSnare = step % 4 === 2;
          const isHat = !isKick && !isSnare;

          if (isKick) {
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.08, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.connect(g); g.connect(this.comp);
            osc.start(t); osc.stop(t + 0.2);
          } else if (isSnare) {
            const dur = 0.06;
            const len = Math.floor(ctx.sampleRate * dur);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(len*0.08));
            const src = ctx.createBufferSource(); src.buffer = buf;
            const bp = ctx.createBiquadFilter();
            bp.type = 'bandpass'; bp.frequency.value = 1200; bp.Q.value = 2;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.04, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            src.connect(bp); bp.connect(g); g.connect(this.comp);
            src.start(t); src.stop(t + dur + 0.01);
          } else {
            const dur = 0.02;
            const len = Math.floor(ctx.sampleRate * dur);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(len*0.03));
            const src = ctx.createBufferSource(); src.buffer = buf;
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass'; hp.frequency.value = 7000 + Math.random() * 3000; hp.Q.value = 3;
            const g = ctx.createGain();
            g.gain.setValueAtTime(0.02 * (1 - calm*0.6), t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
            src.connect(hp); hp.connect(g); g.connect(this.comp);
            src.start(t); src.stop(t + dur + 0.01);
          }
        }

        // ── PAD (new chord each bar) ──
        if (arr.pad && step === 0) {
          const chordFreqs = getChordFreqs();
          // pad register shifts between octaves
          const padOctave = phraseIndex % 3 === 0 ? 1 : phraseIndex % 3 === 1 ? 2 : 0.5;
          for (let ci = 0; ci < chordFreqs.length; ci++) {
            const freq = chordFreqs[ci] * padOctave;
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq;
            const env = ctx.createGain();
            const padVol = 0.01 + calm * 0.012;
            // stagger entry for lush feel
            env.gain.setValueAtTime(0, t + ci * 0.08);
            env.gain.linearRampToValueAtTime(padVol, t + ci * 0.08 + 0.3);
            env.gain.setValueAtTime(padVol * 0.7, t + stepTime * steps * 0.5);
            env.gain.exponentialRampToValueAtTime(0.001, t + stepTime * steps * 0.95);
            osc.connect(env); env.connect(this.reverb);
            osc.start(t + ci * 0.08); osc.stop(t + stepTime * steps);
          }
        }

        this.stepIndex++;
        this.nextStepTime += stepTime;
      }

      setTimeout(() => this.schedule(ctx), 50);
    },

    stop() { this.running = false; }
  };

  function playHeartSound() {
    if (!audioCtx || audioMode === 0) return;
    const t = audioCtx.currentTime;
    advanceHarmony();
    const freqs = getChordFreqs();
    const hrvCalm = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 35)) : 0.5;
    const hrStress = currentHR > 0 ? Math.max(0, Math.min(1, (currentHR - 60) / 80)) : 0;
    let coherence = 0.5;
    if (rrHistory.length >= 4) {
      const mean = rrHistory.reduce((a,b)=>a+b,0) / rrHistory.length;
      const variance = rrHistory.reduce((a,b)=>a+(b-mean)**2,0) / rrHistory.length;
      const cv = Math.sqrt(variance) / mean;
      coherence = Math.max(0, Math.min(1, 1 - cv * 5));
    }

    // ── BASS LAYER: sub-bass thump with body ──
    if (audioMode >= 1) {
      const bassVol = 0.4 + hrvCalm * 0.4;

      // sub-bass sine hit — the chest thump
      const sub = audioCtx.createOscillator();
      sub.type = 'sine';
      sub.frequency.setValueAtTime(currentRoot * 0.5, t);
      sub.frequency.exponentialRampToValueAtTime(currentRoot * 0.25, t + 0.2);
      const subGain = audioCtx.createGain();
      subGain.gain.setValueAtTime(bassVol * 0.5, t);
      subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      sub.connect(subGain); subGain.connect(audioCtx.destination);
      sub.start(t); sub.stop(t + 0.3);

      // lub-dub noise thump on top
      for (const [delay, freq, q, dur] of [[0, 50, 12, 0.12], [0.11, 80, 8, 0.08]]) {
        const len = Math.floor(audioCtx.sampleRate * dur);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * Math.exp(-i/(len*0.1));
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass'; filt.frequency.value = freq; filt.Q.value = q;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(bassVol * (delay ? 0.4 : 0.7), t+delay);
        gain.gain.exponentialRampToValueAtTime(0.001, t+delay+dur+0.06);
        src.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
        src.start(t+delay); src.stop(t+delay+dur+0.1);
      }
    }

    // ── GLASS LAYER: noise-based shatter with resonant ringing ──
    if (audioMode >= 2) {
      const glassVol = 0.08 + (1 - hrvCalm) * 0.15;
      const shardCount = 1 + Math.floor((1 - hrvCalm) * 3);
      for (let s = 0; s < shardCount; s++) {
        const sDelay = Math.random() * 0.06;
        // white noise burst — the crack
        const dur = 0.03 + Math.random() * 0.04;
        const len = Math.floor(audioCtx.sampleRate * dur);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.08));
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;

        // high-pass to keep only the sharp crack
        const hp = audioCtx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 3000 + Math.random() * 5000;
        hp.Q.value = 0.5;

        // resonant ring — the tinkle after the crack
        const ring = audioCtx.createBiquadFilter();
        ring.type = 'bandpass';
        ring.frequency.value = 4000 + Math.random() * 8000;
        ring.Q.value = 40 + Math.random() * 60;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(glassVol * (0.5 + Math.random() * 0.5), t + sDelay);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + sDelay + 0.1 + Math.random() * 0.15);

        src.connect(hp); hp.connect(gain); gain.connect(audioCtx.destination);
        // parallel ring path for shimmer tail
        const ringGain = audioCtx.createGain();
        ringGain.gain.setValueAtTime(glassVol * 0.3, t + sDelay);
        ringGain.gain.exponentialRampToValueAtTime(0.0001, t + sDelay + 0.3 + Math.random() * 0.4);
        src.connect(ring); ring.connect(ringGain); ringGain.connect(audioCtx.destination);

        src.start(t + sDelay); src.stop(t + sDelay + dur + 0.01);
      }
    }

    // ── LAYER 3: chord pad — strummed from harmonic engine ──
    if (audioMode >= 3) {
      const sustain = 0.8 + hrvCalm * 2.5;
      const vol = 0.03 + hrvCalm * 0.03;
      const waveType = hrvCalm > 0.5 ? 'sine' : 'triangle';

      freqs.forEach((freq, i) => {
        const strum = i * 0.035; // staggered for strum feel
        const osc = audioCtx.createOscillator();
        osc.type = waveType;
        osc.frequency.value = freq;
        // vibrato when stressed
        if (hrvCalm < 0.3) {
          osc.frequency.setValueAtTime(freq, t + strum);
          osc.frequency.linearRampToValueAtTime(freq * 1.004, t + strum + 0.2);
          osc.frequency.linearRampToValueAtTime(freq * 0.996, t + strum + 0.4);
          osc.frequency.linearRampToValueAtTime(freq, t + strum + 0.6);
        }
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(vol * (i === 0 ? 1.0 : 0.55), t + strum);
        g.gain.exponentialRampToValueAtTime(0.0005, t + strum + sustain);
        const filt = audioCtx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.value = 500 + hrvCalm * 3500;
        filt.Q.value = 0.7;
        osc.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
        osc.start(t + strum); osc.stop(t + strum + sustain + 0.1);
      });

      // octave shimmer when very calm
      if (hrvCalm > 0.55) {
        const sh = audioCtx.createOscillator();
        sh.type = 'sine';
        sh.frequency.value = freqs[0] * 2;
        const sg = audioCtx.createGain();
        sg.gain.setValueAtTime(0.015, t + 0.1);
        sg.gain.exponentialRampToValueAtTime(0.0005, t + sustain * 1.5);
        // delay tail
        const del = audioCtx.createDelay(); del.delayTime.value = 0.18;
        const dg = audioCtx.createGain(); dg.gain.value = 0.10;
        sh.connect(sg); sg.connect(audioCtx.destination);
        sg.connect(del); del.connect(dg); dg.connect(audioCtx.destination);
        sh.start(t + 0.1); sh.stop(t + sustain * 1.5 + 0.2);
      }
    }
  }

  // WebSocket
  let ws = null;
  function connect() {
    ws = new WebSocket('ws://localhost:8765');
    ws.onopen = () => { statusEl.classList.remove('visible'); };
    ws.onmessage = (e) => {
      try {
        const d = JSON.parse(e.data);
        if (d.type === 'acc') {
          // derive breath from acc magnitude
          // simplified: use Z-axis variation as breath proxy
          if (d.samples && d.samples.length > 0) {
            const last = d.samples[d.samples.length - 1];
            const mag = Math.sqrt(last[0]*last[0] + last[1]*last[1] + last[2]*last[2]);
            breath01 = Math.max(0, Math.min(1, breath01 * 0.95 + (mag / 1100) * 0.05));
          }
        }
        if (d.type === 'hr') {
          if (d.bpm) currentHR = d.bpm;
          if (d.rr) for (const rr of d.rr) {
            if (rr < 200 || rr > 2000) continue;
            rrHistory.push(rr);
            if (rrHistory.length > RR_MAX) rrHistory.shift();
            // Each RR = one heartbeat
            lastBeatTime = performance.now() / 1000;
            beatPhase = 0;
            expectedInterval = rr / 1000;
            if (audioMode === 4 && audioCtx) {
              // generative mode — engine runs independently, heartbeat just advances harmony
              advanceHarmony();
              if (!GEN.running) GEN.start(audioCtx);
            } else {
              playHeartSound();
            }
            spawnBeat(lastBeatTime);
          }
          // Compute RMSSD
          if (rrHistory.length >= 4) {
            let sum = 0;
            for (let i = 1; i < rrHistory.length; i++) {
              const d = rrHistory[i] - rrHistory[i-1];
              sum += d * d;
            }
            currentRMSSD = Math.sqrt(sum / (rrHistory.length - 1));
          }
        }
      } catch(err){}
    };
    ws.onclose = () => { statusEl.classList.add('visible'); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
  }
  connect();

  // Data overlay
  let showData = false;

  // Keyboard
  document.addEventListener('keydown', (e) => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const k = e.key.toLowerCase();
    if (k === 'a') { audioMode = (audioMode + 1) % AUDIO_MODES.length; }
    else if (k === 's') { style = (style + 1) % STYLES.length; ringHealth = 1; ringPopped = false; }
    else if (e.key === '>' || (e.shiftKey && e.key === '.')) { showData = !showData; }
    else if (k === 'f') { document.documentElement.requestFullscreen().catch(()=>{}); }
  });
  document.addEventListener('click', () => { initAudio(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); });

  // Color from HRV
  function getColor(stress, alpha) {
    // stress 0 = deep red, 1 = bright red/white (alarm)
    const r = 180 + stress * 75;
    const g = 20 + stress * 30;
    const b = 20 + stress * 20;
    return `rgba(${r|0},${g|0},${b|0},${alpha})`;
  }

  // Render
  function render(time) {
    const now = time / 1000;
    const elapsed = now - lastBeatTime;
    beatPhase = Math.min(1, elapsed / expectedInterval);

    // Beat envelope: sharp attack, smooth decay
    let beat;
    if (beatPhase < 0.08) {
      beat = Math.sin(beatPhase / 0.08 * Math.PI / 2);
    } else if (beatPhase < 0.35) {
      beat = Math.cos((beatPhase - 0.08) / 0.27 * Math.PI / 2);
    } else {
      beat = Math.max(0, 0.08 * Math.exp(-(beatPhase - 0.35) * 4));
    }

    // Stress level: higher HR = more intense
    const hrStress = currentHR > 0 ? Math.max(0, Math.min(1, (currentHR - 60) / 80)) : 0;
    // High HR alarm: start blinking above 120
    const alarm = currentHR > 120 ? Math.sin(now * currentHR / 10) * 0.5 + 0.5 : 0;

    // Background flash on beat
    const bgFlash = beat * (0.03 + hrStress * 0.08 + alarm * 0.15);
    ctx.fillStyle = `rgb(${(bgFlash*200)|0},${(bgFlash*20)|0},${(bgFlash*15)|0})`;
    ctx.fillRect(0, 0, W, H);

    const cx = W/2, cy = H/2;

    if (style !== 1) containRadius = 0;

    if (style === 0) {
      // PULSE: expanding circle from center
      const maxR = Math.min(W, H) * 0.4;
      const r = maxR * (0.3 + beat * 0.7);
      const grad = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r);
      grad.addColorStop(0, getColor(hrStress, 0.5 + beat * 0.5));
      grad.addColorStop(0.5, getColor(hrStress, 0.15 + beat * 0.2));
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();

      // Inner bright core
      const coreR = r * 0.15;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI*2);
      ctx.fillStyle = getColor(hrStress, beat * 0.8);
      ctx.fill();

    } else if (style === 1) {
      // RING: pulsing ring that contains particles, degrades with hits
      const baseR = Math.min(W, H) * 0.35;
      const r = baseR + beat * baseR * 0.08;
      containRadius = r;
      containCx = cx;
      containCy = cy;

      // regenerate health slowly when not popped
      if (!ringPopped) {
        ringHealth = Math.min(1, ringHealth + RING_REGEN);
      }

      if (ringPopped) {
        const popAge = now - ringPopTime;
        const popProgress = Math.min(1, popAge / RING_POP_DURATION);

        // expanding, fading ring
        const expandR = r + (r * (RING_POP_EXPAND - 1)) * (1 - Math.pow(1 - popProgress, 2));
        const fadeAlpha = Math.max(0, 0.3 * (1 - popProgress));

        // shattered ring — draw as dashed arcs
        ctx.save();
        ctx.setLineDash([15 + popProgress * 30, 10 + popProgress * 40]);
        ctx.strokeStyle = getColor(hrStress, fadeAlpha);
        ctx.lineWidth = 1 + (1 - popProgress) * 3;
        ctx.beginPath();
        ctx.arc(cx, cy, expandR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // reset after pop animation completes
        if (popProgress >= 1) {
          ringPopped = false;
          ringHealth = 0.3; // come back weakened
          ringHits = 0;
        }
      } else {
        // intact ring — opacity and solidity reflect health
        const healthAlpha = 0.05 + ringHealth * 0.35;
        const lineW = (1 + ringHealth * 4) + beat * 6 * ringHealth;

        // cracks: draw as dashed when low health
        if (ringHealth < 0.4) {
          ctx.setLineDash([20 * ringHealth + 5, 15 * (1 - ringHealth)]);
        }

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = getColor(hrStress, healthAlpha + beat * 0.2 * ringHealth);
        ctx.lineWidth = lineW;
        ctx.stroke();
        ctx.setLineDash([]);

        // health indicator glow — red when low
        if (ringHealth < 0.3) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,60,30,${(0.3 - ringHealth) * 1.5})`;
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      // Ripples expanding outward (dimmer when ring is damaged)
      for (let i = 1; i <= 3; i++) {
        const ripplePhase = (beatPhase + i * 0.15) % 1;
        const rippleR = baseR + ripplePhase * baseR * 0.8;
        const rippleAlpha = Math.max(0, (1 - ripplePhase) * 0.12 * ringHealth);
        ctx.beginPath();
        ctx.arc(cx, cy, rippleR, 0, Math.PI * 2);
        ctx.strokeStyle = getColor(hrStress, rippleAlpha);
        ctx.lineWidth = 1;
        ctx.stroke();
      }

    } else if (style === 2) {
      // PARTICLES ONLY: just the particle system, nothing else
    }

    // Particles render on ALL styles as a persistent layer
    drawParticles(hrStress);
    updateParticles(Math.min(0.05, 1/60), now);

    // BPM display
    if (currentHR > 0) {
      const bpmAlpha = 0.06 + beat * 0.08 + alarm * 0.2;
      bpmEl.style.color = `rgba(255,${40 + alarm*100|0},${40 + alarm*60|0},${bpmAlpha})`;
      bpmEl.textContent = currentHR;
      // Scale on beat
      const scale = 1 + beat * 0.05;
      bpmEl.style.transform = `translate(-50%,-50%) scale(${scale})`;
    }

    // Info
    const rmssdStr = currentRMSSD > 0 ? currentRMSSD.toFixed(0) + 'ms' : '--';
    const hrvState = getHrvState();
    const chordLabel = audioMode >= 3 ? ` · ${currentChordName}` : '';
    infoEl.innerHTML = `RMSSD ${rmssdStr} <span style="color:${hrvState.level > 0.5 ? '#7a7' : hrvState.level > 0.3 ? '#aa7' : '#a77'}">${hrvState.label}</span> · ${STYLES[style]} · audio: ${AUDIO_MODES[audioMode]}${chordLabel} · ${particles.length}p` +
      (style === 1 ? ` · ring ${ringPopped ? 'POP' : (ringHealth*100|0)+'%'}` : '');

    // data overlay (Shift+.)
    if (showData) {
      const hrvCalm2 = currentRMSSD > 0 ? Math.max(0, Math.min(1, (currentRMSSD - 5) / 35)) : 0.5;
      const cFreqs = getChordFreqs();
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(W - 260, 10, 250, 300);
      ctx.font = '12px monospace';
      ctx.textAlign = 'left';
      const x0 = W - 250, lh = 18;
      let y0 = 30;
      const ln = (label, val, color) => {
        ctx.fillStyle = '#666'; ctx.fillText(label, x0, y0);
        ctx.fillStyle = color || '#ccc'; ctx.fillText(val, x0 + 100, y0);
        y0 += lh;
      };
      ln('HR', `${currentHR} bpm`, '#e06a7a');
      ln('RMSSD', `${currentRMSSD.toFixed(1)} ms`, '#4af');
      ln('hrvCalm', `${(hrvCalm2*100).toFixed(0)}%`, hrvCalm2 > 0.5 ? '#7a7' : '#a77');
      ln('hrStress', `${(hrStress*100).toFixed(0)}%`, '#e06a7a');
      ln('beat', `${beat.toFixed(2)}`, '#888');
      let coh = 0;
      if (rrHistory.length >= 4) {
        const mn = rrHistory.reduce((a,b)=>a+b,0)/rrHistory.length;
        const vr = rrHistory.reduce((a,b)=>a+(b-mn)**2,0)/rrHistory.length;
        coh = Math.max(0, Math.min(1, 1 - Math.sqrt(vr)/mn * 5));
      }
      ln('coherence', `${coh.toFixed(2)}`, '#aa7');
      ln('chord', currentChordName, '#c89000');
      ln('root', `${currentRoot.toFixed(0)} Hz`, '#c89000');
      ln('freqs', cFreqs.map(f => f.toFixed(0)).join(' '), '#555');
      ln('particles', `${particles.length}`, '#888');
      ln('bass/mid/glass',
        `${particles.filter(p=>p.type==='bass').length}/${particles.filter(p=>p.type==='mid').length}/${particles.filter(p=>p.type==='glass').length}`,
        '#888');
      if (style === 1) {
        ln('ring HP', `${(ringHealth*100).toFixed(0)}%`, ringHealth < 0.3 ? '#e44' : '#7a7');
        ln('ring hits', `${ringHits}`, '#888');
      }
      ln('audio', AUDIO_MODES[audioMode], '#888');
      ln('RR buf', `${rrHistory.length}`, '#555');
      ctx.restore();
    }

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body></html>
