<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>coherence</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070709; overflow: hidden;
                 font-family: ui-monospace, Menlo, monospace; color: #9a9a9a; }
    canvas { display: block; position: fixed; inset: 0; }
    #ctrl { position: fixed; top: 14px; left: 16px; font-size: 12px; line-height: 1.7;
            user-select: none; pointer-events: none; }
    .row { opacity: 0.5; }
    .row.active { opacity: 1; color: #fff; }
    .row .caret { display: inline-block; width: 14px; color: #555; }
    #help { position: fixed; bottom: 12px; left: 16px; font-size: 11px; opacity: 0.3; }
    #nav  { position: fixed; top: 14px; right: 16px; font-size: 11px; opacity: 0.45; }
    #status { position: fixed; bottom: 12px; right: 16px; font-size: 11px; opacity: 0.35; }

    #score { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
             text-align: center; pointer-events: none; user-select: none; }
    #score .v { font-size: 44px; font-weight: 200; color: #fff;
                font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    #score .lbl { font-size: 11px; letter-spacing: 0.25em; opacity: 0.45;
                  text-transform: uppercase; margin-top: -6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="score"><div class="v" id="vScore">—</div><div class="lbl">coherence</div></div>
  <div id="ctrl"></div>
  <div id="session-bar" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
    font-size:12px;display:flex;gap:12px;align-items:center;opacity:0.6;user-select:none">
    <button id="btn-session" style="font:12px monospace;background:#1a1a22;border:1px solid #333;
      color:#ccc;padding:5px 14px;border-radius:3px;cursor:pointer">● record</button>
    <span id="session-timer" style="font-variant-numeric:tabular-nums;color:#555">0:00</span>
    <span id="session-score" style="color:#555">avg —</span>
  </div>
  <div id="help">↑↓ exercise · space pause · F flip · R reset · B audio</div>
  <div id="nav"></div>
  <div id="status">connecting…</div>

  <script type="module">
    import { createBridge, exercises, exerciseNames, createScheduler, navHTML } from './common.js';

    document.getElementById('nav').innerHTML = navHTML('coherence');

    const bridge = createBridge();
    let selectedExercise = 0;
    let scheduler = createScheduler(exercises[exerciseNames[selectedExercise]]);
    let paused = false;

    // ── Audio biofeedback ──────────────────────────────────────
    let audioCtx = null;
    let audioOn = false;
    let droneOsc = null, droneGain = null, droneFilter = null;
    let breathOsc = null, breathGain = null;
    let prevScore = 0;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function startAudio() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      audioOn = true;

      // drone: continuous tone, pitch = coherence, filter = breath
      droneOsc = audioCtx.createOscillator();
      droneOsc.type = 'sine';
      droneOsc.frequency.value = 220;
      const droneOsc2 = audioCtx.createOscillator();
      droneOsc2.type = 'sine';
      droneOsc2.frequency.value = 330; // fifth
      droneFilter = audioCtx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 400;
      droneFilter.Q.value = 2;
      droneGain = audioCtx.createGain();
      droneGain.gain.value = 0;
      const droneGain2 = audioCtx.createGain();
      droneGain2.gain.value = 0;

      droneOsc.connect(droneFilter);
      droneOsc2.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(audioCtx.destination);

      // breath guide tone: pitch follows target breathing pattern
      breathOsc = audioCtx.createOscillator();
      breathOsc.type = 'triangle';
      breathOsc.frequency.value = 300;
      breathGain = audioCtx.createGain();
      breathGain.gain.value = 0;
      const breathFilter = audioCtx.createBiquadFilter();
      breathFilter.type = 'lowpass';
      breathFilter.frequency.value = 1200;
      breathOsc.connect(breathFilter);
      breathFilter.connect(breathGain);
      breathGain.connect(audioCtx.destination);

      droneOsc.start(); droneOsc2.start(); breathOsc.start();

      // store refs for cleanup
      droneOsc._pair = droneOsc2;
      droneOsc._gain2 = droneGain2;
    }

    function stopAudio() {
      audioOn = false;
      if (droneOsc) { droneOsc.stop(); droneOsc._pair.stop(); droneOsc = null; }
      if (breathOsc) { breathOsc.stop(); breathOsc = null; }
    }

    function updateAudio(score, breath01, target, phase, dt) {
      if (!audioOn || !audioCtx) return;
      const t = audioCtx.currentTime;

      // drone volume: fades in with coherence score
      const targetVol = Math.min(0.06, score / 10 * 0.06);
      droneGain.gain.setTargetAtTime(targetVol, t, 0.3);

      // drone pitch: rises with coherence (220 → 440 over 0-10 score)
      // uses just intonation intervals for consonance
      const intervals = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8, 2]; // major scale ratios
      const idx = Math.min(7, Math.floor(score / 10 * 7.99));
      const droneFreq = 110 * intervals[idx];
      droneOsc.frequency.setTargetAtTime(droneFreq, t, 0.5);
      droneOsc._pair.frequency.setTargetAtTime(droneFreq * 1.5, t, 0.5); // fifth above

      // filter opens with coherence
      droneFilter.frequency.setTargetAtTime(300 + score / 10 * 2000, t, 0.3);

      // consonance reward: when score jumps up, play a bright chime
      if (score > prevScore + 1.5 && score > 4) {
        const chime = audioCtx.createOscillator();
        chime.type = 'sine';
        chime.frequency.value = droneFreq * 2;
        const cg = audioCtx.createGain();
        cg.gain.setValueAtTime(0.03, t);
        cg.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        chime.connect(cg); cg.connect(audioCtx.destination);
        chime.start(t); chime.stop(t + 1);
      }
      prevScore = score;

      // breath guide: pitch follows target amplitude
      const breathFreq = 200 + target * 400; // 200-600 Hz
      breathOsc.frequency.setTargetAtTime(breathFreq, t, 0.1);
      // volume: soft guide, louder on inhale
      const breathVol = phase === 'hold' ? 0.005 : 0.015 + target * 0.01;
      breathGain.gain.setTargetAtTime(breathVol, t, 0.1);
    }

    // ── Session recording ──────────────────────────────────────
    let recording = false;
    let sessionStart = 0;
    let sessionData = [];
    const btnSession = document.getElementById('btn-session');
    const timerEl = document.getElementById('session-timer');
    const scoreAvgEl = document.getElementById('session-score');

    btnSession.onclick = () => {
      initAudio();
      if (!recording) {
        recording = true;
        sessionStart = performance.now() / 1000;
        sessionData = [];
        btnSession.textContent = '■ stop';
        btnSession.style.color = '#e55';
      } else {
        recording = false;
        btnSession.textContent = '● record';
        btnSession.style.color = '#ccc';
        finishSession();
      }
    };

    function recordTick(score, hr, breath, coherenceVal) {
      if (!recording) return;
      const elapsed = performance.now() / 1000 - sessionStart;
      sessionData.push({ t: elapsed, score, hr, breath, coherence: coherenceVal });

      // update timer
      const min = Math.floor(elapsed / 60);
      const sec = Math.floor(elapsed % 60);
      timerEl.textContent = `${min}:${sec.toString().padStart(2, '0')}`;

      // running average
      if (sessionData.length > 0) {
        const avg = sessionData.reduce((s, d) => s + d.score, 0) / sessionData.length;
        scoreAvgEl.textContent = `avg ${avg.toFixed(1)}`;
        scoreAvgEl.style.color = avg >= 6 ? '#7a7' : avg >= 3 ? '#aa7' : '#a77';
      }
    }

    function finishSession() {
      if (sessionData.length < 10) return;
      const duration = sessionData[sessionData.length - 1].t;
      const avgScore = sessionData.reduce((s, d) => s + d.score, 0) / sessionData.length;
      const maxScore = Math.max(...sessionData.map(d => d.score));
      const avgHR = sessionData.reduce((s, d) => s + d.hr, 0) / sessionData.length;
      const timeAbove5 = sessionData.filter(d => d.score >= 5).length / sessionData.length * 100;
      const timeAbove7 = sessionData.filter(d => d.score >= 7).length / sessionData.length * 100;

      // sparkline
      const scores = sessionData.filter((_, i) => i % Math.max(1, Math.floor(sessionData.length / 40)) === 0).map(d => d.score);

      const summary = {
        exercise: exerciseNames[selectedExercise],
        duration_s: Math.round(duration),
        avg_score: Math.round(avgScore * 10) / 10,
        max_score: Math.round(maxScore * 10) / 10,
        avg_hr: Math.round(avgHR),
        time_above_5_pct: Math.round(timeAbove5),
        time_above_7_pct: Math.round(timeAbove7),
        samples: sessionData.length,
        timestamp: new Date().toISOString(),
      };

      // save to localStorage
      const sessions = JSON.parse(localStorage.getItem('coherence_sessions') || '[]');
      sessions.push(summary);
      localStorage.setItem('coherence_sessions', JSON.stringify(sessions));

      // announce results
      const msg = `Session complete. ${Math.floor(duration/60)} minutes. Average coherence ${avgScore.toFixed(1)}. ` +
        `${timeAbove5.toFixed(0)} percent above 5. Peak ${maxScore.toFixed(1)}.`;

      if (audioCtx) {
        // victory chime if good session
        if (avgScore >= 5) {
          const t = audioCtx.currentTime;
          [1, 5/4, 3/2, 2].forEach((r, i) => {
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.value = 440 * r;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(0.04, t + i * 0.15);
            g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(t + i * 0.15); o.stop(t + i * 0.15 + 1.2);
          });
        }
      }

      console.log('Session:', summary);
      alert(`Session: ${Math.floor(duration/60)}m ${Math.round(duration%60)}s\n` +
        `Avg coherence: ${avgScore.toFixed(1)}/10\n` +
        `Peak: ${maxScore.toFixed(1)}\n` +
        `Time ≥5: ${timeAbove5.toFixed(0)}%\n` +
        `Time ≥7: ${timeAbove7.toFixed(0)}%\n` +
        `HR avg: ${Math.round(avgHR)}\n` +
        `Pattern: ${exerciseNames[selectedExercise]}`);
    }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
    }
    resize();
    addEventListener('resize', resize);

    const ctrlEl = document.getElementById('ctrl');
    const statusEl = document.getElementById('status');
    const scoreEl = document.getElementById('vScore');
    function renderCtrl() {
      ctrlEl.innerHTML = exerciseNames.map((n, i) => {
        const cls = i === selectedExercise ? 'row active' : 'row';
        const caret = i === selectedExercise ? '▸' : ' ';
        return `<div class="${cls}"><span class="caret">${caret}</span>${n}</div>`;
      }).join('');
    }
    renderCtrl();
    addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        selectedExercise = (selectedExercise - 1 + exerciseNames.length) % exerciseNames.length;
        scheduler = createScheduler(exercises[exerciseNames[selectedExercise]]);
        renderCtrl();
      } else if (e.key === 'ArrowDown') {
        selectedExercise = (selectedExercise + 1) % exerciseNames.length;
        scheduler = createScheduler(exercises[exerciseNames[selectedExercise]]);
        renderCtrl();
      } else if (e.key === 'f' || e.key === 'F') {
        bridge.toggleFlip();
      } else if (e.key === 'r' || e.key === 'R') {
        scheduler.reset();
      } else if (e.key === ' ') {
        paused = !paused;
      } else if (e.key === 'b' || e.key === 'B') {
        if (!audioOn) startAudio(); else stopAudio();
      } else return;
      e.preventDefault();
    });

    // ---- guide amplitude at arbitrary cycle time ----
    // Sine-eased for smooth, organic curves instead of sharp triangles
    function guideAmplitude(segs, t) {
      let elapsed = 0;
      for (let i = 0; i < segs.length; i++) {
        if (t < elapsed + segs[i].d) {
          const frac = (t - elapsed) / segs[i].d;
          // sine ease: smooth start and end
          const eased = (1 - Math.cos(frac * Math.PI)) / 2;
          if (segs[i].p === 'inhale') return eased;
          if (segs[i].p === 'exhale') return 1 - eased;
          const prev = segs[(i - 1 + segs.length) % segs.length];
          return prev.p === 'inhale' ? 1 : 0;
        }
        elapsed += segs[i].d;
      }
      return 0;
    }

    // ---- rolling history (90 s at 10 Hz) ----
    const FPS = 10;
    const SECONDS = 90;
    const N = FPS * SECONDS;
    const hrBuf = new Float32Array(N);
    const brBuf = new Float32Array(N);
    let writeIdx = 0;
    let histCount = 0;
    let lastSample = -1;

    function record(t, hrVal, brVal) {
      if (t - lastSample < 1 / FPS) return;
      lastSample = t;
      hrBuf[writeIdx] = hrVal;
      brBuf[writeIdx] = brVal;
      writeIdx = (writeIdx + 1) % N;
      histCount = Math.min(N, histCount + 1);
    }

    function coherence() {
      // Pearson correlation between HR and breath over last ~60s, after
      // DC-removing both. High correlation at breath frequency = high RSA.
      const n = Math.min(histCount, FPS * 60);
      if (n < 30) return 0;
      let mh = 0, mb = 0;
      for (let i = 0; i < n; i++) {
        const idx = (writeIdx - 1 - i + N) % N;
        mh += hrBuf[idx]; mb += brBuf[idx];
      }
      mh /= n; mb /= n;
      let num = 0, dh = 0, db = 0;
      for (let i = 0; i < n; i++) {
        const idx = (writeIdx - 1 - i + N) % N;
        const h = hrBuf[idx] - mh;
        const b = brBuf[idx] - mb;
        num += h * b;
        dh += h * h;
        db += b * b;
      }
      return num / (Math.sqrt(dh * db) + 1e-9);
    }

    let lastT = performance.now() / 1000;
    let smoothedHR = 60;
    let smoothedBR = 0.5;

    function tick() {
      requestAnimationFrame(tick);
      const now = performance.now() / 1000;
      const dt = Math.min(0.1, now - lastT);
      lastT = now;
      if (!paused) scheduler.tick(dt);

      let hrVal = bridge.hrInst > 0 ? bridge.hrInst : bridge.hr;
      if (!isFinite(hrVal) || hrVal < 20 || hrVal > 250) hrVal = smoothedHR;
      smoothedHR += (hrVal - smoothedHR) * (1 - Math.exp(-dt * 1.5));
      if (!isFinite(smoothedHR)) smoothedHR = 60;
      smoothedBR += (bridge.breath01 - smoothedBR) * (1 - Math.exp(-dt * 6));
      record(now, smoothedHR, smoothedBR);

      const corr = coherence();
      const score = isFinite(corr) ? Math.max(0, Math.min(10, corr * 10)) : 0;

      // audio + recording
      const seg = scheduler.current();
      const target = scheduler.targetAmplitude();
      updateAudio(score, smoothedBR, target, seg.phase, dt);
      recordTick(score, smoothedHR, smoothedBR, corr);

      // ---- render ----
      const dpr = devicePixelRatio;
      const w = canvas.width, h = canvas.height;
      const padX = 60 * dpr;
      const padTop = 100 * dpr;
      const padBot = 60 * dpr;
      const gap = 24 * dpr;
      const chartH = (h - padTop - padBot - gap) / 2;
      const chartW = w - padX * 2;

      ctx.fillStyle = '#070709';
      ctx.fillRect(0, 0, w, h);

      function drawTrace(buf, top, color, label, minV, maxV) {
        // axis frame
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1 * dpr;
        ctx.strokeRect(padX, top, chartW, chartH);

        // label
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = `${11 * dpr}px ui-monospace, Menlo, monospace`;
        ctx.textAlign = 'left';
        ctx.fillText(label, padX + 6 * dpr, top + 14 * dpr);

        // min/max labels
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.textAlign = 'right';
        ctx.fillText(maxV.toFixed(0), padX - 6 * dpr, top + 10 * dpr);
        ctx.fillText(minV.toFixed(0), padX - 6 * dpr, top + chartH);

        ctx.strokeStyle = color;
        ctx.lineWidth = 2 * dpr;
        ctx.beginPath();
        const nShown = Math.min(histCount, N);
        for (let i = 0; i < nShown; i++) {
          const idx = (writeIdx - 1 - i + N) % N;
          const x = padX + chartW * (1 - i / N);
          const norm = (buf[idx] - minV) / (maxV - minV + 1e-9);
          const y = top + chartH * (1 - Math.max(0, Math.min(1, norm)));
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // adaptive HR range
      let hrMin = Infinity, hrMax = -Infinity;
      const nShown = Math.min(histCount, N);
      for (let i = 0; i < nShown; i++) {
        const idx = (writeIdx - 1 - i + N) % N;
        hrMin = Math.min(hrMin, hrBuf[idx]);
        hrMax = Math.max(hrMax, hrBuf[idx]);
      }
      if (!isFinite(hrMin)) { hrMin = smoothedHR - 10; hrMax = smoothedHR + 10; }
      const hrPad = Math.max(4, (hrMax - hrMin) * 0.2);

      drawTrace(hrBuf, padTop, '#e06a7a', 'heart rate', hrMin - hrPad, hrMax + hrPad);
      drawTrace(brBuf, padTop + chartH + gap, '#6cc5e6', 'breath',  0, 1);

      // score color bands: red <3, yellow 3-6, green 6+
      const scoreColor = score >= 6 ? '#7ee39a' : score >= 3 ? '#e8ca6d' : '#e06a7a';
      scoreEl.textContent = score.toFixed(1);
      scoreEl.style.color = scoreColor;

      // ---- breathing guide: target waveform overlaid on breath chart ----
      const seg = scheduler.current();
      const target = scheduler.targetAmplitude();
      const segs = seg.segments;
      const cycleDuration = segs.reduce((s, e) => s + e.d, 0);
      const brTop = padTop + chartH + gap;

      // draw the guide pattern as a repeating waveform across the full chart width
      // each pixel column = a moment in the pattern's past
      ctx.save();

      // filled band showing the guide zone (±tolerance)
      const tolerance = 0.12;
      ctx.fillStyle = 'rgba(230,178,108,0.06)';
      ctx.beginPath();
      for (let px = 0; px <= chartW; px++) {
        const secsAgo = (1 - px / chartW) * SECONDS;
        const guideT = ((now - secsAgo) % cycleDuration + cycleDuration) % cycleDuration;
        const gv = guideAmplitude(segs, guideT);
        const yHi = brTop + chartH * (1 - Math.min(1, gv + tolerance));
        if (px === 0) ctx.moveTo(padX + px, yHi); else ctx.lineTo(padX + px, yHi);
      }
      for (let px = chartW; px >= 0; px--) {
        const secsAgo = (1 - px / chartW) * SECONDS;
        const guideT = ((now - secsAgo) % cycleDuration + cycleDuration) % cycleDuration;
        const gv = guideAmplitude(segs, guideT);
        const yLo = brTop + chartH * (1 - Math.max(0, gv - tolerance));
        ctx.lineTo(padX + px, yLo);
      }
      ctx.closePath();
      ctx.fill();

      // guide line itself
      ctx.strokeStyle = '#e6b26c';
      ctx.lineWidth = 2 * dpr;
      ctx.globalAlpha = 0.5;
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      ctx.beginPath();
      for (let px = 0; px <= chartW; px += 2) {
        const secsAgo = (1 - px / chartW) * SECONDS;
        const guideT = ((now - secsAgo) % cycleDuration + cycleDuration) % cycleDuration;
        const gv = guideAmplitude(segs, guideT);
        const yy = brTop + chartH * (1 - gv);
        if (px === 0) ctx.moveTo(padX + px, yy); else ctx.lineTo(padX + px, yy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;

      // current target marker on the right edge
      const targetY = brTop + chartH * (1 - target);
      ctx.fillStyle = '#e6b26c';
      ctx.beginPath();
      ctx.arc(padX + chartW, targetY, 5 * dpr, 0, Math.PI * 2);
      ctx.fill();

      // phase label — large, at the right edge of the breath chart
      const phaseColor = seg.phase === 'inhale' ? '#6cc5e6'
                       : seg.phase === 'exhale' ? '#e6b26c' : '#888';
      ctx.fillStyle = phaseColor;
      ctx.globalAlpha = paused ? 0.15 : 0.85;
      ctx.font = `300 ${28 * dpr}px ui-monospace, Menlo, monospace`;
      ctx.textAlign = 'right';
      ctx.fillText(seg.phase, padX + chartW - 12 * dpr, brTop + 36 * dpr);
      ctx.font = `200 ${48 * dpr}px ui-monospace, Menlo, monospace`;
      ctx.fillText(Math.ceil(seg.remaining), padX + chartW - 12 * dpr, brTop + 82 * dpr);
      ctx.globalAlpha = 1;

      // paused overlay
      if (paused) {
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        ctx.font = `${14 * dpr}px ui-monospace, Menlo, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText('paused — space to resume', w / 2, h - padBot + 20 * dpr);
      }

      ctx.restore();

      const parts = [];
      if (bridge.connected) {
        parts.push(`hr ${bridge.hr}${bridge.hrInst ? ' ('+bridge.hrInst+')' : ''}`);
        parts.push(`${seg.phase} ${Math.ceil(seg.remaining)}s`);
        if (bridge.battery != null) parts.push(`${bridge.battery}%`);
        if (bridge.flip) parts.push('flip');
      } else {
        parts.push('disconnected');
      }
      statusEl.textContent = parts.join(' · ');
    }

    tick();
  </script>
</body>
</html>
